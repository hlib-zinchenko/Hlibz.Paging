# Weekly, grouped: one PR for all NuGet updates, one for all GitHub Actions, one for the SDK.
# CI runs the tests on every PR, so a green check is what makes these safe to merge.
# EF Core is pinned per target framework (see Directory.Packages.props), so a major bump would
# put the wrong major on a target: patches and minors only.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: Microsoft.EntityFrameworkCore*
        update-types: ["version-update:semver-major"]
      # The Roslyn the generator compiles against is a deliberately low minimum, never bumped.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
    groups:
      nuget:
        patterns: ["*"]
  # The SDK pinned in global.json: one PR per new patch, which CI then builds with it.
  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
